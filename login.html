<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Hub | تسجيل الدخول</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar-nav">
        <a href="index.html" class="brand-logo">
            <span>&lt;/&#92;/&gt;</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" title="الرئيسية"><i class="fa fa-home"></i></a></li>
            <li><a href="store.html" title="المتجر"><i class="fa fa-th-large"></i></a></li>
            <li><a href="pricing.html" title="الباقات"><i class="fa fa-tags"></i></a></li>
            <li><a href="login.html" class="active" title="الحساب"><i class="fa fa-user"></i></a></li>
            <li><a href="contact.html" title="تواصل معنا"><i class="fa fa-envelope"></i></a></li>
        </ul>
        <div class="theme-switch-wrapper">
            <button id="themeToggleBtn" class="theme-toggle-btn" title="تغيير المظهر">
                <i class="fa fa-adjust"></i>
            </button>
        </div>
    </aside>

    <div class="main-wrapper d-flex flex-column justify-content-between min-vh-100">
        <header class="top-header">
            <div class="search-bar-container">
                <h4 class="mb-0 text-muted">بوابة الدعم وإدارة الحساب</h4>
            </div>
        </header>

        <main class="content-area d-flex align-items-center justify-content-center">
            <div class="auth-card p-4 p-sm-5 w-100" style="max-width: 450px;">
                <div class="text-center mb-4">
                    <span class="auth-brand">&lt;/&#92;/&gt;</span>
                    <h3 class="mt-2">مرحباً بك في N Hub</h3>
                </div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">البريد الإلكتروني الأكاديمي</label>
                        <input type="email" class="form-control custom-input" id="loginEmail" placeholder="student@university.edu" required>
                        <div class="invalid-feedback">يرجى إدخال بريد إلكتروني صحيح.</div>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">كلمة المرور</label>
                        <input type="password" class="form-control custom-input" id="loginPassword" placeholder="••••••••" required>
                        <div class="invalid-feedback">كلمة المرور يجب أن لا تقل عن 6 خانات.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3 py-2">تسجيل الدخول</button>
                </form>
            </div>
        </main>

        <footer class="main-footer py-4">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col-md-6 text-center text-md-start">
                        <p class="mb-0">&copy; 2026 N Hub. جميع الحقوق محفوظة.</p>
                    </div>
                    <div class="col-md-6 text-center text-md-end">
                        <span class="footer-logo">&lt;/&#92;/&gt; N Hub Platform</span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast custom-toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">إشعار N Hub</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                تمت العملية بنجاح.
            </div>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
